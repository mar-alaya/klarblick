<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./index.css" />
    <title>Klarblick</title>
  </head>
  <body>
    <header class="bg-black p-4">
      <nav>
        <div class="navbar bg-base-100 shadow-sm rounded-2xl p-4">
          <div class="flex-1">
            <a class="btn btn-ghost text-xl">Klar<span>Blick</span></a>
          </div>
          <div class="flex gap-2">
            <div class="dropdown dropdown-end">
              <div
                tabindex="0"
                role="button"
                class="btn btn-ghost btn-circle avatar"
              >
                <div class="w-10 rounded-full">
                  <img
                    alt="Tailwind CSS Navbar component"
                    src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp"
                  />
                </div>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
              >
                <li>
                  <a class="justify-between"> Profile </a>
                </li>
                <li><a>Settings</a></li>
                <li><a>Logout</a></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
      <section>
        <div>
          <div class="hero-content flex-col p-10 lg:flex-row-reverse">
            <div>
              <h1 class="text-5xl font-bold text-white">Welcome back, Mar!</h1>
              <p class="text-white py-6">
                Here's what needs yout attention today.
              </p>
            </div>
          </div>
        </div>
      </section>
    </header>
    <main class="bg-pink-200 p-4 flex flex-col gap-10">
      <section class="section-overview flex justify-center items-center">
        <div class="stats shadow bg-white mx-4 min-w-200">
          <div class="stat">
            <div class="stat-figure text-secondary">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                class="inline-block h-8 w-8 stroke-current"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
            </div>
            <div class="stat-title text-lg">Total Tasks</div>
            <div class="stat-value" id="total-tasks"></div>
          </div>

          <div class="stat">
            <div class="stat-figure text-secondary">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32px"
                height="32px"
                viewBox="0 0 16 16"
              >
                <path d="M0 0h16v16H0z" fill="none" />
                <path
                  fill="currentColor"
                  d="M3 11a2 2 0 1 1 0 4a2 2 0 0 1 0-4m11 1a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2zM3 6a2 2 0 1 1 0 4a2 2 0 0 1 0-4m11 1a1 1 0 1 1 0 2H7a1 1 0 0 1 0-2zM3 1a2 2 0 1 1 0 4a2 2 0 0 1 0-4m11 1a1 1 0 1 1 0 2H7a1 1 0 0 1 0-2z"
                />
              </svg>
            </div>
            <div class="stat-title text-lg">To Do</div>
            <div class="stat-value" id="total-todo"></div>
          </div>

          <div class="stat">
            <div class="stat-figure text-secondary">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32px"
                height="32px"
                viewBox="0 0 24 24"
              >
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                  fill="currentColor"
                  d="M16.62 6.21a1 1 0 0 0-1.41.17l-7 9l-3.43-4.18a1 1 0 1 0-1.56 1.25l4.17 5.18a1 1 0 0 0 .78.37a1 1 0 0 0 .83-.38l7.83-10a1 1 0 0 0-.21-1.41m5 0a1 1 0 0 0-1.41.17l-7 9l-.61-.75l-1.26 1.62l1.1 1.37a1 1 0 0 0 .78.37a1 1 0 0 0 .78-.38l7.83-10a1 1 0 0 0-.21-1.4"
                />
                <path
                  fill="currentColor"
                  d="M8.71 13.06L10 11.44l-.2-.24a1 1 0 0 0-1.43-.2a1 1 0 0 0-.15 1.41Z"
                />
              </svg>
            </div>
            <div class="stat-title text-lg">Finished</div>
            <div class="stat-value" id="total-finished"></div>
          </div>
        </div>
      </section>
      <section>
        <div class="main-area flex justify-between mx-4 flex-wrap">
          <article id="open-tasks" class="flex-1">
            <p class="text-secondary font-bold bg-white inline p-4 rounded-2xl">
              Your Tasks
            </p>
            <ol class="list bg-base-100 rounded-box shadow-md"></ol>
          </article>

          <aside
            id="form-new-task"
            class="bg-white rounded-2xl p-4 min-w-150 ml-5 text-center flex flex-col gap-5"
          >
            <h2 class="text-secondary font-bold text-xl">Create a new task</h2>
            <fieldset class="fieldset">
              <label class="fieldset-legend" for="name">Name</label>
              <input
                type="text"
                id="form-name"
                class="input w-full"
                placeholder="Name of task"
              />
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Description</legend>
              <textarea
                class="textarea h-24 w-full"
                placeholder="Short description of the task"
                id="form-description"
              ></textarea>
            </fieldset>
            <fieldset class="fieldset text-left">
              <label for="form-priority" class="fieldset-legend"
                >Priorität</label
              >
              <select id="form-priority" class="input w-full">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
              </select>
            </fieldset>
            <button class="btn btn-outline btn-secondary" id="create-task">
              + Add Task
            </button>
          </aside>
        </div>
      </section>
    </main>
    <footer
      class="footer sm:footer-horizontal bg-neutral text-neutral-content items-center p-4"
    >
      <aside class="grid-flow-col items-center p-4">
        <p>Copyright © 2026 - All right reserved</p>
      </aside>
      <nav class="grid-flow-col gap-4 md:place-self-center md:justify-self-end">
        <a>
          <svg
            aria-label="Twitter"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            class="fill-current"
          >
            <path
              d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"
            ></path>
          </svg>
        </a>
        <a>
          <svg
            aria-label="YouTube"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            class="fill-current"
          >
            <path
              d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"
            ></path>
          </svg>
        </a>
        <a>
          <svg
            aria-label="Facebook"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            class="fill-current"
          >
            <path
              d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"
            ></path>
          </svg>
        </a>
      </nav>
    </footer>
  </body>
</html>
